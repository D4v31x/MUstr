name: muni_timetable
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  xml: ^7.0.1
  file_picker: ^12.3.0
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  uuid: ^4.6.0
  google_fonts: ^8.2.1
  material_3_expressive: ^1.1.2
  home_widget: ^0.9.4
  package_info_plus: ^10.2.1
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  posthog_flutter: ^5.24.0
  dynamic_color: ^2.1.0
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/MUNI_Time_icon.png
    - assets/google_fonts/
  fonts:
    - family: MuniBold
      fonts:
        - asset: assets/muni-bold.otf
    - family: Figtree
      fonts:
        - asset: assets/google_fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Figtree-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/MUNI_Time_icon.png"
  min_sdk_android: 21

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
