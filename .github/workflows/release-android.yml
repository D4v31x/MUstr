name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec
        run: |
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${APP_VERSION%%+*}
          test "${GITHUB_REF_NAME#v}" = "$VERSION_NAME"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mustr-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=mustr-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Prepare release assets
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp build/app/outputs/flutter-apk/app-release.apk "MUstr-$VERSION.apk"
          sha256sum "MUstr-$VERSION.apk" > "MUstr-$VERSION.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "MUstr-$VERSION.apk" \
            "MUstr-$VERSION.apk.sha256" \
            --generate-notes \
            --title "MUstr $VERSION"